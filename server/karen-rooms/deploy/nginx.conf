include /etc/nginx/karen-services-http.d/*.conf;
# Karen domain relay and read-only status page. Trusted Cloudflare addresses preserve client IP budgets.
limit_conn_zone $karen_client_ip zone=karen_cf_ip_connections:1m;
limit_conn_zone $server_name zone=karen_direct_connections:1m;
limit_req_zone $karen_client_ip zone=karen_cf_ip_handshakes:1m rate=30r/m;
limit_req_zone $server_name zone=karen_direct_handshakes:1m rate=5r/s;
limit_req_zone $karen_client_ip zone=karen_cf_ip_status:1m rate=5r/s;
limit_req_zone $server_name zone=karen_direct_status:1m rate=20r/s;
log_format karen_direct_safe '$time_iso8601 status=$status bytes=$body_bytes_sent seconds=$request_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name karen-multiplayer-relay-c7a91e5d.17181718.xyz;
    ssl_certificate /etc/letsencrypt/live/karen-services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karen-services/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/karen-rooms/current/web;
    access_log /var/log/karen-rooms/access.log karen_direct_safe buffer=16k flush=5s;
    error_log /var/log/karen-rooms/error.log error;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 4k;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    reset_timedout_connection on;
    ssl_session_cache shared:karen_gateway_tls:1m;
    ssl_session_timeout 10m;
    client_body_timeout 10s;
    send_timeout 15s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    # Dedicated overwritten header is the only proxy identity trusted by the relay.
    proxy_set_header X-Karen-Client-IP $karen_client_ip;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_http_version 1.1;

    location = /rooms {
        if ($request_method != GET) { return 405; }
        limit_conn karen_cf_ip_connections 16;
        limit_conn karen_direct_connections 80;
        limit_req zone=karen_cf_ip_handshakes burst=8 nodelay;
        limit_req zone=karen_direct_handshakes burst=10 nodelay;
        proxy_pass http://127.0.0.1:42766;
        # Repeat inherited proxy headers: adding Upgrade replaces the inherited set.
        proxy_set_header X-Karen-Client-IP $karen_client_ip;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 15s;
    }
    location = /__STATUS_PATH__/api/status {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=karen_cf_ip_status burst=10 nodelay;
        limit_req zone=karen_direct_status burst=20 nodelay;
        proxy_method GET;
        proxy_pass http://127.0.0.1:42766/api/status;
    }
    location = /healthz {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=karen_cf_ip_status burst=10 nodelay;
        limit_req zone=karen_direct_status burst=20 nodelay;
        proxy_method GET;
        proxy_pass http://127.0.0.1:42766;
    }
    location = /__STATUS_PATH__ { return 308 /__STATUS_PATH__/; }
    location = /__STATUS_PATH__/ { if ($request_method !~ ^(GET|HEAD)$) { return 405; } try_files /index.html =404; }
    location = /__STATUS_PATH__/app.js { if ($request_method !~ ^(GET|HEAD)$) { return 405; } try_files /app.js =404; }
    location = /__STATUS_PATH__/style.css { if ($request_method !~ ^(GET|HEAD)$) { return 405; } try_files /style.css =404; }
    location / { return 404; }
}

# The observatory owns its paths, read credential and upload limits independently.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name karen-run-observatory-b4d82f6a.17181718.xyz;
    ssl_certificate /etc/letsencrypt/live/karen-services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karen-services/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/karen-rooms/error.log error;
    client_max_body_size 4k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    reset_timedout_connection on;
    send_timeout 15s;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    include /etc/nginx/karen-services.d/*.conf;
    location / { return 404; }
}
