<script>
const $=s=>document.getElementById(s),NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){let n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));parent.append(n);return n}
function star(p,x,y,scale=1,opacity=1){el('use',{href:'#star',transform:`translate(${x} ${y}) scale(${scale})`,opacity},p)}
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,t)=>a+(b-a)*t;
let mode='void',action='activate',t=0,running=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
const positions=(i,time)=>{let y=145+(i%5)*39;return [340+Math.cos(i*2.4+time*.6)*(12+(y-140)*.22),y+Math.sin(i+time)*4]};
function line(points,opacity){el('path',{d:points,fill:'none',stroke:'#ffe7ad','stroke-width':1.4,opacity},$('link'))}
function card(x,y,a=1,s=1){el('use',{href:'#card',transform:`translate(${x} ${y}) scale(${s})`,opacity:a},$('moving'))}
function pulse(q){if(q<=0)return;el('ellipse',{cx:105,cy:445,rx:40+q*5,ry:51+q*5,fill:'none',stroke:'#fff0bd','stroke-width':1.8,opacity:q},$('pilePulse'))}
const flash=$('tower').cloneNode(true);flash.removeAttribute('id');flash.setAttribute('stroke','#fff0d8');flash.setAttribute('stroke-width','2.8');for(let path of flash.children){path.setAttribute('stroke','#fff0d8');path.setAttribute('opacity','1')} $('towerFlash').append(flash);
function placeCounter(){
 let kind=$('countPosition').value, spec=kind==='foot'?[211,414,'M8 5H27L39 -5','左下塔脚：与塔的归属清楚，避开头部、血条和状态图标。实机需按塔脚定位，并为左下抽牌堆留出间距。']:kind==='middle'?[236,274,'M8 4H36L54 18','左侧中部：接近当前位置，容易看到；人物动作或变形时容易与身体、武器争空间。']:[340,43,'','塔顶可以用：整体居中，文字底缘与塔尖留约 22 像素。数字保持稳定亮度，不随整塔闪白；实机还需按屏幕边缘限制位置。'];
 $('towerCount').setAttribute('text-anchor',kind==='top'?'middle':'end');$('counter').setAttribute('transform',`translate(${spec[0]} ${spec[1]})`);$('counterLine').setAttribute('d',spec[2]);$('placementNote').textContent=spec[3];
}
const sourceStyles={
 whole:['整塔闪亮','整座骨架短闪，存在感最直接。适合偶发触发；连续补牌时需要合并闪光。'],
 local:['局部灯珠','横梁汇光，最克制。适合频繁补牌，视线干扰较小。'],
 run:['塔脚走灯','光沿两侧塔腿向上跑，在横梁汇合后凝出星星。塔本身成为补牌来源；我更推荐这一版。'],
 beam:['双追光聚焦','两道窄追光扫向横梁，交汇处生成星星。舞台感最强，实机要压低光束透明度。'],
 marquee:['旋转灯珠','参考再生产卡图中的环形灯珠：灯珠轮流追逐点亮，向中心收束后吐出星星。最贴近卡图的灯牌语言。']
};
function drawSourceMotion(sec){
 const g=$('sourceMotion');g.replaceChildren();let style=$('flashStyle').value;
 $('styleDescription').textContent=mode==='void'?'补牌动画仅在再生产开启时出现。':sourceStyles[style][1];
 if(mode==='void'||style==='whole'||style==='local')return;
 let age=sec-(mode==='both'?.08:.02),u=clamp(age/.36),fade=smooth(age/.055)*(1-smooth((age-.43)/.35));
 if(age<0||fade<=0)return;
 if(style==='run'){
  for(let side of [-1,1]){
   const point=v=>{let x=(1-v)*(1-v)*106+2*(1-v)*v*46+v*v*25;return [340+side*x,433-200*v]};
   for(let k=9;k>=0;k--){let v=u-k*.027;if(v<0)continue;let p=point(v),alpha=fade*(1-k/11);el('circle',{cx:p[0],cy:p[1],r:k===0?4:2,fill:'#fff2cd',opacity:alpha},g);if(k<9){let q=point(Math.max(0,v-.027));el('path',{d:`M${q[0]} ${q[1]}L${p[0]} ${p[1]}`,stroke:'#ffcbaa','stroke-width':3,opacity:alpha*.7},g)}}
   if(u>.8){let x=mix(340+side*25,340,smooth((u-.8)/.2));star(g,x,233,1.1,fade)}
  }
 }else if(style==='beam'){
  for(let side of [-1,1]){
   let x=340+side*106,focusX=mix(340-side*65,340,smooth(u));
   el('path',{d:`M${x-3} 427L${focusX-12} 224Q${focusX} 215 ${focusX+12} 224L${x+3} 427Z`,fill:'#fff1ca',opacity:fade*.16},g);
   el('path',{d:`M${x} 427L${focusX} 229`,stroke:'#ffebbd','stroke-width':1.4,opacity:fade*.65},g);star(g,x,427,.55,fade);
  }star(g,340,233,1.6,smooth((u-.7)/.3)*fade);
 }else{
  let radius=35-24*smooth((u-.6)/.4),theta=age*9;
  for(let i=0;i<16;i++){let a=i*Math.PI/8+theta,head=(Math.cos(i*Math.PI/4-age*18)+1)/2;el('circle',{cx:340+Math.cos(a)*radius,cy:233+Math.sin(a)*radius,r:1.5+head*1.3,fill:head>.55?'#fff2cf':'#ff7388',opacity:fade*(.25+head*.75)},g)}
  el('circle',{cx:340,cy:233,r:radius+5,fill:'none',stroke:'#ff647e','stroke-width':1,opacity:fade*.4},g);star(g,340,233,1.4,smooth((u-.5)/.5)*fade);
 }
}
function render(){
 drawSourceMotion(t/1000);placeCounter();let flashAge=t/1000-(mode==='both'?.36:.16),flashPower=mode!=='void'&&$('flashStyle').value==='whole'?smooth(flashAge/.07)*(1-smooth((flashAge-.07)/.26)):0;$('towerFlash').setAttribute('opacity',flashPower*.88);
 for(let id of ['stars','birth','link','moving','pilePulse'])$(id).replaceChildren();
 let sec=t/1000,ct=5,phase='两处稳定显示同一批卡牌';
 if(mode==='both'){
  let count=action==='four'?4:1,base=10-count;ct=10;
  for(let i=0;i<base;i++)star($('stars'),...positions(i,sec),.8);
  let birthGlow=0;
  for(let i=0;i<count;i++){
   let start=.3+i*.25,age=sec-start,dest=positions(base+i,sec);
   if(age<0){star($('stars'),...dest,.8);continue}
   let travel=smooth(age/.42);
   if(travel<1)card(mix(105,690+i*44,travel),420-100*Math.sin(travel*Math.PI),1,.65+.35*travel);
   let birthAge=age-.1,join=smooth(birthAge/.48);
   if(birthAge<0){ct--;star($('stars'),...dest,.8,1-smooth(age/.1));continue}
   birthGlow=Math.max(birthGlow,Math.max(0,1-birthAge/.3));
   if(join<1){let x=mix(340,dest[0],join),y=mix(233,dest[1],join)-32*Math.sin(join*Math.PI);star($('birth'),x,y,.8, smooth(birthAge/.04));}
   else star($('stars'),...dest,.8);
  }
  el('path',{d:'M310 234H370',stroke:'#ffedc9','stroke-width':3,opacity:birthGlow*.8},$('birth'));star($('birth'),340,233,1.15,birthGlow);
  pulse(birthGlow*.6);$('pileCount').textContent=ct;$('towerCount').textContent=ct+' ∞ ◇';
  phase=sec<.3?'两种能力已开启：两处都对应同一批 10 张续演':sec<1.25?'从抽牌堆取牌；旧塔星熄灭，新续演紧接着生成补位':'补牌完成：抽牌堆与塔星均为 10，手牌增加 '+count+' 张';
 }else if(mode==='void'){
  let progress=smooth((sec-.3)/.48),inAction=action==='put',draw=action==='draw';ct=(draw&&progress>.5)?4:(inAction&&progress>.5)?6:5;
  let active=action==='activate'?Math.sin(Math.PI*clamp((sec-.25)/.6)):Math.sin(Math.PI*progress);
  for(let i=0;i<(inAction?6:5);i++){let p=positions(i,sec);let a=i===0&&draw?1-progress:i===5&&inAction?progress:1;star($('stars'),...p,i===0?1+active*.6:1,a)}
  pulse(active);
  if(action==='activate'){
   let p=positions(0,sec);line(`M105 403 Q152 242 ${p[0]} ${p[1]}`,active*.35);phase=sec<.3?'原有塔星保留；抽牌堆建立同一份视觉映射':sec<.95?'塔星和抽牌堆同时闪亮，没有卡牌搬走':'两边均显示 5；仍然只有 5 张实际卡牌';
  }else{
   let from=inAction?[825,430]:[105,420],to=inAction?[105,420]:[825,430];
   if(sec>.3&&progress<1)card(mix(from[0],to[0],progress),mix(from[1],to[1],progress)-120*Math.sin(progress*Math.PI),1,inAction?1-progress*.6:.6+progress*.4);
   let p=positions(inAction?5:0,sec);line(`M105 403 Q160 263 ${p[0]} ${p[1]}`,active*.3);
   phase=sec<.3?(inAction?'准备放入 1 张':'准备抽取 1 张'):sec<.8?(inAction?'卡牌收进抽牌堆，塔内对应星星点亮':'卡牌从抽牌堆飞出，塔内对应星星同步熄灭'):`两边同步变为 ${ct}；卡牌只有一条飞行轨迹`;
  }
  $('pileCount').textContent=ct;$('towerCount').textContent=ct+' ◇';
 }else{
  let count=action==='four'?4:1,base=10-count;ct=base;
  for(let i=0;i<base;i++)star($('stars'),...positions(i,sec),.8);

  el('path',{d:'M310 234H370',stroke:'#f85c74','stroke-width':5,opacity:.25+glow*.6},$('birth'));
  for(let i=0;i<7;i++){let dist=Math.abs(i-3);let light=Math.max(0,1-Math.abs(sec-(.2+(3-dist)*.04))/.12)*.85+glow*.15;el('circle',{cx:313+i*9,cy:233,r:1.7+light*.7,fill:'#fff2d4',opacity:.25+light},$('birth'))}

   star($('birth'),x,y,.7+.5*Math.sin(p*Math.PI),smooth(age/.07));
  }
  star($('birth'),...source,1+glow*.45,glow*.85);
  $('pileCount').textContent='5';$('towerCount').textContent=ct+' ∞';
  phase=sec<.2?'塔内刚抽走 '+count+' 张，留下空位':sec<.38?(sourceStyles[$('flashStyle').value][0]+'：光汇到横梁，准备凝出星星'):sec<.95+count*.085?'从同一处生成 '+count+' 颗星星，错开进入轨道':'补齐 10 颗驻留星；灯珠恢复暗态';
 }
 $('phase').textContent=phase;$('scrub').value=t;$('time').textContent=sec.toFixed(2)+'s';$('pause').textContent=running?'暂停':'继续';
}
function setup(m){mode=m;action=m==='void'?'activate':'one';$('void').setAttribute('aria-pressed',m==='void');$('reproduce').setAttribute('aria-pressed',m==='reproduce');$('both').setAttribute('aria-pressed',m==='both');$('title').textContent=m==='void'?'同一批牌，两处映射':'补牌来源 · 五种方案';$('desc').textContent=m==='void'?'抽牌堆保留卡背与计数，塔里保留每张牌对应的星星。抽取、放入时两处同步变化。':'在下方切换补牌动画：沿塔腿走灯、追光聚焦、旋转灯珠，以及原来的整体或局部闪亮。每种方案都在横梁处凝出同款星星。';$('details').innerHTML=m==='void'?'<p>抽牌从左下角出发，落入原生手牌槽位。塔星只做同步消隐，不再额外飞出第二张牌。</p><p>切换模式：保留塔星的位置与运动相位；抽牌堆短闪一次，取消整堆往返拖尾。</p>':'<p>单张约 0.85 秒；四张共用一次亮灯，间隔 85 ms 出星，约 1.1 秒完成。</p><p>每批共用一次光源动画，保留透空骨架；不逐张重复启动光源或弹绿色能力提示。与空虚同时生效时，抽牌堆计数同步短亮。</p>';$('stageLabel').textContent=m==='void'?'空虚模式 · 抽牌堆 ↔ 约定塔':'再生产 · 从卡图灯牌提取局部灯珠';$('actions').replaceChildren();let items=m==='void'?[['activate','切换模式'],['draw','抽出 1 张'],['put','放入 1 张']]:[['one','补充 1 张'],['four','补充 4 张']];for(let [key,label]of items){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{action=key;t=0;running=true;render()};$('actions').append(b)}if(m==='both'){
 $('title').textContent='从牌堆抽出，由塔补回';$('desc').textContent='空虚负责两处映射，再生产负责补足续演。每张抽取后紧接补齐，塔里旧星熄灭、新星从横梁诞生。';

 $('stageLabel').textContent='双能力 · 抽牌堆与塔同时存在';
 for(let b of $('actions').children)b.textContent=b.textContent.replace('补充','抽取并补回');
 }t=0;render()}
